name: Deploy Blazor WASM to GitHub Pages
on:
  push:
    branches: [ main ]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        run: dotnet publish BlazorWasmDemo/BlazorWasmDemo.csproj -c Release -o publish-output
      - name: Fix base href
        run: sed -i 's|<base href="/" />|<base href="/UndoRedoData/" />|g' publish-output/wwwroot/index.html
      - name: Add .nojekyll
        run: touch publish-output/wwwroot/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish-output/wwwroot
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4