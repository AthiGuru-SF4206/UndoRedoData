# ============================================================================
# OPTIMIZED BUG-FIX CONFIGURATION
# Version: 2.1 (Skill-Mapped, Token-Efficient)
# Purpose: Eliminate manual file searching by mapping features to skills + files
# ============================================================================

schema: bug-fix-optimized
version: 2.1
component: blazor-grid
mode: skill-driven

⚠️  CRITICAL SESSION RULE (MANDATORY ENFORCEMENT):
  
  DO NOT RE-READ FILES ALREADY REVIEWED IN THE CURRENT SESSION.
  
  - Once a file is read and cached in the session, DO NOT read it again
  - Maintain a running list of "Files Examined This Session" 
  - Before reading ANY file, check if it was already read THIS SESSION
  - If already read, retrieve cached content from memory instead of re-reading
  - This applies ACROSS ALL STAGES (Stage 1, 2, 3, 4, 5)
  - Violating this rule wastes 200-400 tokens per duplicate read
  - ENFORCEMENT: MANDATORY — abort and note violation if duplicate detected

description: |
  Optimized bug-fix workflow that uses PRE-EXISTING feature documentation
  and skills instead of manually searching the codebase. Each feature domain
  has an associated SKILL file with:
  - Knowledge references (specific file paths)
  - Code location map (exact methods/properties)
  - Interaction matrix (cross-feature test scope)
  - Training insights (Blazor patterns, API contracts)
  
  This eliminates excessive token usage by being PRESCRIPTIVE instead of
  EXPLORATORY.

# ============================================================================
# FEATURE-SKILL MAPPING
# Key: Use this map to load domain knowledge WITHOUT reading entire codebase
# ============================================================================

# Optional: `related_skills` lists companion skills that MUST also be loaded
# for the same feature domain when present.
