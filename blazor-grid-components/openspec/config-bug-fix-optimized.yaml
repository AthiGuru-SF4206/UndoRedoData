# ============================================================================
# ITERATIVE CORRECTION WORKFLOW (NEW - v2.1.2)
# ============================================================================
# Purpose: Enable efficient review → correct → apply cycle with minimal tokens
# Strategy: Surgical edits instead of re-reading entire files
# Token Savings: 80% vs re-reading (50 tokens per correction vs 500+)
# ============================================================================

iterative_correction_workflow:
  name: "Iterative Review & Correction Framework"
  version: "2.1.2"
  
  purpose: |
    Enable efficient feedback loop for proposal.md, design.md, tasks.md files.
    Users review artifacts, report specific corrections, system applies surgical
    edits. Minimizes token consumption by targeted edits only.
  
  key_rules:
    
    rule_1:
      title: "Report Issues Specifically"
      description: |
        When you identify an issue, report in structured format:
        - FILE: Which file (proposal.md / design.md / tasks.md)
        - SECTION: Section name or line number
        - CURRENT: What it says now
        - CORRECT: What it should say
        - WHY: Reason for change (brief)
      enforcement: "MANDATORY for efficient corrections"
    
    rule_2:
      title: "Batch Corrections When Possible"
      description: |
        Report ALL issues at once instead of one at a time.
        System applies all corrections in sequence in single pass.
        Prevents re-reading same file multiple times.
      enforcement: "RECOMMENDED for efficiency"
    
    rule_3:
      title: "Use Targeted Edits Only"
      description: |
        System uses replace_string_in_file with 3-5 line context.
        Never re-reads entire file or duplicates content.
        Each correction is surgical, not broad rewrites.
      enforcement: "MANDATORY - system will enforce"
    
    rule_4:
      title: "No Re-Reading Entire Artifacts"
      description: |
        When correcting proposal.md, do NOT re-read design.md or tasks.md.
        When correcting design.md, do NOT re-read proposal.md.
        Reference only affected sections.
      enforcement: "MANDATORY - prevents token waste"
    
    rule_5:
      title: "Verify Before/After"
      description: |
        After each correction, system shows before/after snippets.
        User verifies correction is right before proceeding.
      enforcement: "MANDATORY for quality assurance"
    
    rule_6:
      title: "No Unnecessary File Recreation"
      description: |
        Do NOT create new files during corrections.
        Only modify: proposal.md, design.md, tasks.md (as needed).
      enforcement: "STRICT - abort if unnecessary files detected"
    
    rule_7:
      title: "Reference Specs When Reporting"
      description: |
        Include spec references in corrections when applicable.
        Provides context for why correction is needed.
      enforcement: "RECOMMENDED for clarity"
    
    rule_8:
      title: "Repeat Until Perfect"
      description: |
        Iteration cycle: Review → Report → Correct → Verify → Repeat.
        Each cycle costs minimal tokens (50-200).
        Continue until all corrections complete and satisfied.
      enforcement: "PROCESS - repeat as needed"
  
  workflow_steps:
    - "Step 1: User receives proposal.md, design.md, tasks.md"
    - "Step 2: User reviews and reports issues in structured format"
    - "Step 3: System applies targeted corrections (read only affected sections)"
    - "Step 4: User verifies before/after of each correction"
    - "Step 5: Repeat steps 2-4 if more corrections needed"
  
  token_savings:
    - "Single correction: 50-200 tokens (vs 500 if re-reading all)"
    - "Five corrections: 250-1000 tokens (vs 2500 if re-reading all)"
    - "Typical review cycle: 300-500 tokens (vs 1500-2500)"
    - "80% token reduction vs re-read approach"

