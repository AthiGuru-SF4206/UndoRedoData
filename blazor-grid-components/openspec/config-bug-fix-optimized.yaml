      tests:
        - "tests/Bunit/"
    interactions: ["all — testing is cross-cutting"]
    lines_per_file: 80
    risk_level: "medium"

# ============================================================================
# BUG-FIX WORKFLOW (Optimized - No Codebase-Wide Searches)
# ============================================================================

bug_fix_workflow:
  description: "5-Stage Optimized Workflow using Skills + Specific Files"
  stages: 5
  
  stage_1:
    name: "BUG VALIDATION"
    instructions: |
      ⚠️  SESSION CACHE RULE: Check .session-read-cache.log BEFORE reading any file.
      If file already read THIS SESSION, use cached version instead of re-reading.
      
      1. Parse bug description for domain keyword (e.g., "sorting", "filtering", "virtualization")
      2. Load feature_skill_map.[domain] from THIS FILE
      3. Load primary SKILL.md file and all related_skills (if present)
      4. Load ONLY the specific files listed in feature_skill_map.[domain].files (max 120 lines each)
         ✓ For each file: Check session cache FIRST before reading
         ✓ If in cache, use cached content; if not, read and cache
      5. Do NOT search entire codebase — read ONLY the mapped files
      6. Identify root cause (file:method:line)
      7. Create failing BUnit test
      8. Output: exploration.md
    token_budget: 2400
    approval_gate: true
    session_cache_requirement: "MANDATORY — enforce cache checks"
    
  stage_2:
    name: "TDD DESIGN"
    instructions: |
      ⚠️  SESSION CACHE RULE: DO NOT re-read files from Stage 1. Use cached versions.
      Check .session-read-cache.log for all files already examined.
      
      1. After approval, create test suite (all FAIL initially)
      2. Load domain spec from feature_skill_map.[domain].spec
         ✓ Check cache FIRST if already read in Stage 1
      3. Load interaction tests scope from feature_skill_map.[domain].interactions
      4. Create proposal.md, design.md, tasks.md
      5. Reference lessons-learned.md for similar bugs (new file, check cache if exists)
      6. Output: proposal.md, design.md, tasks.md, specs/
    token_budget: 2600
    approval_gate: true
    session_cache_requirement: "MANDATORY — use cached Stage 1 reads"
  
  stage_3:
    name: "FIX VERIFICATION"
    instructions: |
      ⚠️  SESSION CACHE RULE: Reuse all cached files from Stages 1-2.
      DO NOT re-read any file already examined. Reference cache only.
      
      1. Implement fix from tasks.md
      2. Run tests: all PASS
      3. Run regression tests (cross-feature from interactions)
         ✓ Files for regression testing: check cache FIRST
      4. Auto-proceed if 100% tests pass
      5. Output: Modified source files + updated tasks.md
    token_budget: 2500
    approval_gate: false  # Auto-proceed
    session_cache_requirement: "MANDATORY — reuse cached files, no re-reads"
  
  stage_4:
    name: "SECURITY & PERFORMANCE"
    instructions: |
      1. Run security checklist (from bug-fix-security-performance-standards.md)
      2. Measure performance (baseline vs post-fix)
      3. Verify token budget not exceeded
      4. Output: Gate checklist (inline only)
    token_budget: 1600
    approval_gate: true
  
  stage_5:
    name: "ARCHIVE"
    instructions: |
      1. Move to archive folder
      2. Delete ephemeral files (.read-cache.csv, *.log)
      3. Keep ONLY 6 core artifacts
      4. Update lessons-learned.md
      5. Auto-proceed
    token_budget: 500
    approval_gate: false  # Auto-proceed

# ============================================================================
# PROMPT REFERENCES (Skill-Aware)
# ============================================================================

prompts:
  bug_fix_entry: ".github/prompts/opsx-bug-fix-integrated.prompt.md"
  generate_dispatcher: ".github/prompts/opsx-generate.prompt.md"
  skill_loader: ".github/skills/bug-fix-resolver/SKILL.md"

# ============================================================================
# OPTIMIZATION RULES (Token Efficiency)
# ============================================================================

optimization_rules:
  
  rule_1_skill_first:
    name: "Load Skill Before Codebase"
    description: "Always load the domain SKILL.md FIRST — it has code location map pre-built"
    benefit: "Eliminates 40% of manual file searches"
    enforcement: "MANDATORY"
  
  rule_2_file_whitelist:
    name: "Read Only Mapped Files"
    description: "ONLY read files listed in feature_skill_map.[domain].files"
    benefit: "Prevents scanning entire codebase (saves 1000+ tokens per bug)"
    enforcement: "STRICT — abort if attempting to read unlisted file"
  
  rule_3_lines_limit:
    name: "Max 120 Lines Per File"
    description: "Read only the number of lines specified in feature_skill_map.[domain].lines_per_file"
    benefit: "Focuses on relevant code sections (saves 30% per file read)"
    enforcement: "STRICT"
  
  rule_4_cache_reads:
    name: "Cache All File Reads WITHIN SESSION (CRITICAL)"
    description: |
      MANDATORY: Log every file read in session memory; SKIP DUPLICATES
      - Maintain "Session Read Cache" (in-memory or logged)
      - Check cache BEFORE every file read
      - If file already read THIS SESSION → retrieve cached version
      - Do NOT re-read same file, even if requested
      - This applies across ALL 5 stages
      - Clear cache ONLY at session end or on explicit reset command
    benefit: "Prevents re-reading same file in later stages (saves 30-50% tokens per session)"
    enforcement: "MANDATORY — abort and error if violation detected"
    session_scope: "entire bug-fix workflow (Stage 1 through Stage 5)"
  
  rule_5_spec_first:
    name: "Read Spec Before Code"
    description: "Read domain spec from feature_skill_map.[domain].spec BEFORE reading code files"
    benefit: "Provides context for what to look for (saves 15% tokens in code analysis)"
    enforcement: "RECOMMENDED"
  
  rule_6_interactions_only:
    name: "Regression Test Only Interactions"
    description: "From feature_skill_map.[domain].interactions, run tests ONLY for listed domains"
    benefit: "Eliminates unnecessary regression tests (saves 40% test execution time)"
    enforcement: "STRICT"
  
  rule_7_no_broad_searches:
    name: "No Codebase-Wide Searches"
    description: "Never grep entire src/; grep ONLY files in feature_skill_map.[domain].files"
    benefit: "Eliminates token waste from searching unrelated code"
    enforcement: "MANDATORY"
  
  rule_8_session_read_cache:
    name: "SESSION-LEVEL READ CACHING (⚠️  CRITICAL)"
    description: |
      DO NOT RE-READ FILES ALREADY EXAMINED IN THIS SESSION.
      
      Implementation:
      - Maintain "Session Files Cache": { filename → cached_content }
      - At session start: Initialize empty cache
      - Before each file read: Query cache for filename
        • IF found in cache → use cached content immediately
        • IF NOT found → read file, add to cache, use content
      - NEVER read a file twice in same session
      - Cache persists across ALL 5 stages
      - Log all cache hits to .session-read-cache.log
      
      Failure Mode:
      - Duplicate read detected → IMMEDIATE ERROR
      - Message: "ERROR: File [filename] already read this session. Use cached version."
      - Stop processing; require explicit "clear-cache" command to proceed
      
      Token Savings:
      - Per duplicate read prevented: 200-400 tokens
      - Per session (typical bug): 800-1600 tokens
      - Per month (20 bugs): 16,000-32,000 tokens
    
    enforcement: "MANDATORY — enforce with error on violation"
    scope: "Session-wide (all stages, all features, all domains)"
    tracking: "Log file: .session-read-cache.log (auto-generated)"

# ============================================================================
# SESSION-LEVEL FILE READ TRACKING (⚠️  CRITICAL FOR TOKEN EFFICIENCY)
# ============================================================================

session_read_cache:
  name: "Session Read Cache — Prevent Re-Reads"
  description: |
    Track all file reads WITHIN A SINGLE BUG-FIX SESSION.
    Purpose: Eliminate duplicate file reads across all 5 stages.
    
  init: "At session start, create empty cache"
  structure: |
    Session Cache:
    {
      "files_examined": [
        {
          "filename": "src/GridSortSettings.razor.cs",
          "read_at_stage": "Stage 1",
          "line_range": "1-120",
          "cached": true,
          "timestamp": "2026-03-30T10:15:22Z"
        },
        {
          "filename": "src/GridFilterSettings.razor.cs",
          "read_at_stage": "Stage 1",
          "line_range": "1-120",
          "cached": true,
          "timestamp": "2026-03-30T10:15:45Z"
        }
        // ... more files ...
      ]
    }
  
  checks:
    pre_read: "Before reading any file, check if filename exists in session cache"
    on_found: "Use cached content; do NOT read file again; log as cache hit"
    on_not_found: "Read file, add to cache with timestamp, then use content"
  
  output: ".session-read-cache.log (auto-maintained, visible at session end)"
  
  enforcement: "MANDATORY — Error on duplicate read attempt"
  
  benefits:
    per_duplicate_prevented: "200-400 tokens saved"
    typical_bug_30files: "800-1600 tokens saved"
    monthly_20bugs: "16,000-32,000 tokens saved"

# ============================================================================
# TOKEN BUDGET ENFORCEMENT
# ============================================================================

token_budgets:
  global_hard_limit: 3000
  
  by_stage:
    stage_1: 2400
    stage_2: 2600
    stage_3: 2500
    stage_4: 1600
    stage_5: 500
  
  session_read_cache_savings:
    description: "Tokens saved by preventing duplicate reads within session"
    typical_savings_per_session: "800-1600 tokens"
    tracking_file: ".session-read-cache.log"

