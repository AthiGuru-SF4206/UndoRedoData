  propose_mode: ".codestudio/prompts/opsx-propose.prompt.md"
  apply_mode: ".codestudio/prompts/opsx-apply.prompt.md"
  archive_mode: ".codestudio/prompts/opsx-archive.prompt.md"
  
  # Bug-schema stage prompts (10-stage original workflow)
  generate_dispatcher:      ".github/prompts/opsx-generate.prompt.md"
  generate_bug_report:      ".github/prompts/opsx-generate-bug-report.prompt.md"
  generate_root_cause:      ".github/prompts/opsx-generate-root-cause.prompt.md"
  generate_tdd_tests:       ".github/prompts/opsx-generate-tdd-tests.prompt.md"
  generate_fix_spec:        ".github/prompts/opsx-generate-fix-spec.prompt.md"
  generate_implementation:  ".github/prompts/opsx-generate-implementation.prompt.md"
  generate_regression:      ".github/prompts/opsx-generate-regression-tests.prompt.md"
  generate_performance:     ".github/prompts/opsx-generate-performance-tests.prompt.md"
  generate_security:        ".github/prompts/opsx-generate-security-tests.prompt.md"
  generate_human_approval:  ".github/prompts/opsx-generate-human-approval.prompt.md"
  generate_final_verify:    ".github/prompts/opsx-generate-final-verification.prompt.md"
  
  # ⭐ Optimized Bug-fix prompts (5-stage workflow with skill mapping)
  bug_fix_optimized:        ".github/prompts/opsx-bug-fix-optimized.prompt.md"
  bug_fix_integrated:       ".github/prompts/opsx-bug-fix-integrated.prompt.md"
  bug_fix_resolver:         ".github/prompts/opsx-bug-fix-resolver.prompt.md"
  
  # Bug-fix optimization configuration reference
  bug_fix_config_optimized: "openspec/config-bug-fix-optimized.yaml"
  bug_fix_config_original:  "openspec/config.yaml (domain_map section)"



# ============================================================================
# BUG-SCHEMA OPERATION REGISTRATION
# ============================================================================

operations:   
  bug_fix_optimized:
    name: "Bug-Fix Workflow Optimized (bug-schema-optimized — 5-stage skill-mapped)"
    schema: "bug-schema-optimized"
    entry_command: "/opsx:bug-fix <bug-description>"
    dispatcher_prompt: ".github/prompts/opsx-bug-fix-optimized.prompt.md"
    configuration_file: "openspec/config-bug-fix-optimized.yaml"
    config_version: "2.1.1"
    templates_dir: "openspec/templates/"
    workflow_stages: 5
    
    optimization_features:
      - "Skill-driven domain mapping (feature_skill_map)"
      - "No codebase-wide searches (reads only mapped files)"
      - "Session-level read caching (prevents duplicate file reads)"
      - "Line-limited reads (120 lines max per file)"
      - "Token budget enforcement (3000 tokens per bug)"
      - "Pre-built regression scope (interactions matrix)"
      - "60% token reduction vs 10-stage workflow"
    
    approval_gates:
      - "Stage 1: BUG VALIDATION — root cause + failing test approved"
      - "Stage 2: TDD DESIGN — test suite (all fail) approved"
      - "Stage 3: FIX VERIFICATION — auto-proceed if all tests pass + no regressions"
      - "Stage 4: SECURITY & PERFORMANCE — security + performance checklist approved"
      - "Stage 5: ARCHIVE — auto-proceed, lessons-learned updated"
    
    artifacts:
      - { id: bug-validation,    stage: 1, generates: "exploration.md" }
      - { id: tdd-design,        stage: 2, generates: "proposal.md, design.md, tasks.md, specs/" }
      - { id: fix-verification,  stage: 3, generates: "[source-files-modified]" }
      - { id: security-perf,     stage: 4, generates: "[gate-checklist-inline]" }
      - { id: archive,           stage: 5, generates: "[archive-folder]" }
    
    session_caching:
      enabled: true
      tracking_file: ".session-read-cache.log"
      enforcement: "MANDATORY across all 5 stages"
      description: |
        Session-level caching prevents re-reading the same file in a single
        bug-fix workflow. Each file read is logged with timestamp, stage, and
        line range. Before reading any file, check cache first.
    
    token_budget:
      global_limit: 3000
      by_stage:
        stage_1: 2400  # BUG VALIDATION
        stage_2: 2600  # TDD DESIGN
        stage_3: 2500  # FIX VERIFICATION
        stage_4: 1600  # SECURITY & PERFORMANCE
        stage_5: 500   # ARCHIVE
    
    output_location: "openspec/changes/<change-name>/"
    
    regression_matrix:
      strategy: "From feature_skill_map.[domain].interactions — pre-built, no manual discovery"
      scope: "Only test domains listed in interactions; no unrelated tests"
      automation: "Automatic scope determination from config-bug-fix-optimized.yaml"

# ============================================================================
# BUG-FIX OPTIMIZATION INTEGRATION SUMMARY
# ============================================================================

bug_fix_integration:
  
  schema_files:
    original_schema: "bug-schema.yaml (10-stage, exploratory)"
    optimized_schema: "openspec/config-bug-fix-optimized.yaml (5-stage, skill-mapped)"
    description: |
      The optimized schema (config-bug-fix-optimized.yaml v2.1.1) is now 
      integrated into config.yaml via:
      1. New "bug-schema-optimized" entry in schemas section
      2. New "bug_fix_optimized" operation in operations section
      3. Prompts mapping in prompts section
      4. Feature_skill_map reference in bug_fix_optimization_mapping section
  
  key_configuration_files:
    - "openspec/config.yaml (this file — orchestration)"
    - "openspec/config-bug-fix-optimized.yaml (domain skill mapping + session caching)"
    - ".github/prompts/opsx-bug-fix-optimized.prompt.md (5-stage workflow prompt)"
    - ".github/prompts/opsx-bug-fix-integrated.prompt.md (integrated workflow)"
    - ".github/prompts/opsx-bug-fix-resolver.prompt.md (resolver agent)"
  
  feature_skill_map_domains:
    description: "Mapped domains in config-bug-fix-optimized.yaml"
    core_data:
      - sorting (high risk)
      - filtering (high risk)
      - grouping (critical risk)
      - paging (medium risk)
      - search (low risk)
      - aggregates (medium risk)
      - virtualization (critical risk)
      - infinite-scroll (critical risk)
    editing: [editing]
    selection: [selection]
    columns: [columns]
    templates: [templates]
    events: [events]
    foundation: [lifecycle, interop]
  
  session_read_caching_enforcement:
    rule: "DO NOT re-read files already reviewed in the current session"
    tracking: ".session-read-cache.log (auto-maintained)"
    enforcement: "MANDATORY — abort on duplicate read attempt"
    benefits:
      - "Prevents token waste from duplicate reads"
      - "Typical savings: 800-1600 tokens per bug"
      - "Monthly savings (20 bugs): 16,000-32,000 tokens"
    
    workflow_integration:
      stage_1: "Initialize and populate session cache"
      stage_2: "Check cache BEFORE any file read"
      stage_3: "Reuse cached files only"
      stage_4: "Reference cache, no new file reads"
      stage_5: "Clear cache after archiving"
  
  optimization_rules_mapped:
    rule_1: "Load Skill Before Codebase (40% token savings)"
    rule_2: "Read Only Mapped Files (saves 1000+ tokens per bug)"
    rule_3: "Max 120 Lines Per File (saves 30% per file read)"
    rule_4: "Cache All File Reads Within SESSION (30-50% tokens saved) — CRITICAL"
    rule_5: "Read Spec Before Code (saves 15% tokens)"
    rule_6: "Regression Test Only Interactions (saves 40% test time)"
    rule_7: "No Codebase-Wide Searches (eliminates token waste)"
    rule_8: "SESSION-LEVEL READ CACHING — MANDATORY ENFORCEMENT"
  
  token_budget_comparison:
    original_10_stage:
      total_per_bug: "~6000 tokens (variable)"
      efficiency: "baseline"
      workflow: "exploratory"
    
    optimized_5_stage:
      total_per_bug: "3000 tokens (hard limit)"
      efficiency: "60% reduction"
      workflow: "prescriptive"
      savings: "3600+ tokens per bug"
  
  usage_guidance:
    use_optimized_when:
      - "Bug domain is clearly identified (sorting, filtering, etc.)"
      - "Feature is well-mapped in feature_skill_map"
      - "Token budget optimization is priority"
      - "Fast turnaround required"
    
    use_original_when:
      - "Complex cross-feature bugs"
      - "Novel or unmapped feature domains"
      - "Thorough exploration required"
      - "Analyzing new architectural patterns"
  
  integration_checklist:
    domain_mapping: "✅ feature_skill_map integrated into config-bug-fix-optimized.yaml"
    schema_files: "✅ config-bug-fix-optimized.yaml in openspec/"
    prompts: "✅ opsx-bug-fix-optimized.prompt.md in .github/prompts/"
    config_schema: "✅ bug-schema-optimized entry in schemas section"
    operations: "✅ bug_fix_optimized entry in operations section"
    prompts_section: "✅ bug_fix_optimized prompts mapped in prompts section"
    session_caching: "✅ Session-level read caching rules enforced across stages"
    regression_scope: "✅ Regression matrix pre-built in feature_skill_map.interactions"
  
  cross_references:
    from_config_yaml_to_optimized:
      - "schemas:bug-schema-optimized → config-bug-fix-optimized.yaml"
      - "operations:bug_fix_optimized → feature_skill_map in config-bug-fix-optimized.yaml"
      - "prompts:bug_fix_optimized → opsx-bug-fix-optimized.prompt.md"
      - "bug_fix_optimization_mapping → comprehensive integration guide"
    
    from_optimized_back_to_config_yaml:
      - "config-bug-fix-optimized.yaml:feature_skill_map → domain_map in config.yaml"
      - "All optimization_rules → enforced by prompts from config.yaml"
      - "All session_read_cache rules → enforced by workflows from config.yaml"

